name: Generate archived BRnFS demo visuals (temporary)
on:
  push:
    branches:
      - docs/project-presentation-20261102
    paths:
      - .github/workflows/build-showcase.yml
permissions:
  contents: write
jobs:
  build-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade 'yt-dlp[default]' yt-dlp-ejs pillow
      - name: Download owner's public demo
        run: |
          mkdir -p /tmp/brnfs-source
          yt-dlp --js-runtimes node --extractor-args 'youtube:player_client=android,web_safari,web' --no-playlist --no-progress -f "bestvideo[height<=1080]+bestaudio/best[height<=1080]/best" --merge-output-format mp4 -o "/tmp/brnfs-source/demo.%(ext)s" "https://www.youtube.com/watch?v=h5yaBS06S4U"
      - name: Extract authentic GUI stills and GIFs
        run: |
          cat > /tmp/brnfs_showcase.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import subprocess
          import glob
          src = Path(glob.glob('/tmp/brnfs-source/demo.*')[0])
          out = Path('docs/assets/showcase')
          out.mkdir(parents=True,exist_ok=True)
          def run(args):
              subprocess.run(args,check=True,stdout=subprocess.DEVNULL)
          def frame(sec):
              tmp=Path('/tmp')/f'brnfs-frame-{sec}.png'
              run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(sec),'-i',str(src),'-frames:v','1','-vf','scale=864:540',str(tmp)])
              return Image.open(tmp).convert('RGB')
          try:
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',25)
              small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',14)
          except OSError:
              font=ImageFont.load_default()
              small=font
          def compare(first,second,source_box,target_box,title_a,title_b,caption,output):
              a=frame(first).crop(source_box).resize((728,436),Image.Resampling.LANCZOS)
              b=frame(second).crop(target_box).resize((728,436),Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(1510,522),'white')
              draw=ImageDraw.Draw(canvas)
              canvas.paste(a,(18,56));canvas.paste(b,(764,56))
              draw.text((20,15),title_a,fill='#17212e',font=font)
              draw.text((768,15),title_b,fill='#17212e',font=font)
              draw.text((20,499),caption,fill='#4b5563',font=small)
              canvas.save(out/output,quality=87,optimize=True,subsampling=0)
          compare(385,400,(392,166,756,384),(392,166,756,384),'Soft fusion (correct)','Hard (Argmin) - negative control','Frames from the original demonstration; no new inference was run.','focus_negative_control.jpg')
          compare(442,468,(12,166,378,384),(392,166,756,384),'Focus overlay (preview only)','Rendered bokeh output','The overlay is a preview, not a live bokeh render.','bokeh_overlay_vs_render.jpg')
          for name,start,length in [('focus_gui.gif',378,25),('bokeh_gui.gif',425,49)]:
              run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-t',str(length),'-i',str(src),'-vf','fps=2,scale=864:540,crop=768:360:0:20,scale=704:330','-loop','0',str(out/name)])
          PY
          python /tmp/brnfs_showcase.py
          du -h docs/assets/showcase/*
      - name: Commit visuals only to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/showcase
          git commit -m "docs: add GUI visuals from archived demo [skip ci]"
          git push origin HEAD:refs/heads/docs/project-presentation-20261102
